  <script>
    (function() {
      'use strict';
      
      console.log("🔗 [INLINE] Chargement intégration conso → IndexedDB");

      let checkCount = 0;
      const maxChecks = 200; // 20 secondes au lieu de 5
      
      function waitAndIntegrate() {
        checkCount++;
        
        if (window.claraverseProcessor) {
          console.log("✅ [INLINE] claraverseProcessor trouvé après " + (checkCount * 100) + "ms");
          doIntegration();
          return;
        }
        
        if (checkCount < maxChecks) {
          setTimeout(waitAndIntegrate, 100);
        } else {
          console.error("❌ [INLINE] claraverseProcessor non trouvé après 20 secondes");
          console.error("❌ [INLINE] window.claraverseProcessor =", window.claraverseProcessor);
          console.error("❌ [INLINE] Toutes les propriétés window:", Object.keys(window).filter(k => k.toLowerCase().includes('clara')));
        }
      }
      
      function doIntegration() {
        const processor = window.claraverseProcessor;
        
        // Éviter double intégration
        if (processor.__integrated) {
          console.log("ℹ️ [INLINE] Déjà intégré, skip");
          return;
        }
        
        // 🔔 LOG: Initialisation système
        if (window.PersistanceLogger) {
          const sessionId = getSessionId();
          window.PersistanceLogger.logInit(sessionId);
        }
        
        const originalSaveTableDataNow = processor.saveTableDataNow;
        const originalSaveAllData = processor.saveAllData;
        
        console.log("🔧 [INLINE] Remplacement de saveTableDataNow...");
        
        processor.saveTableDataNow = function(table) {
          if (!table) {
            console.warn("⚠️ [INLINE] Table null");
            return;
          }
          
          console.log("💾 [INLINE] Interception sauvegarde table");
          
          try {
            originalSaveTableDataNow.call(this, table);
          } catch (e) {
            console.warn("⚠️ [INLINE] Erreur méthode originale:", e);
          }
          
          try {
            emitSaveEvent(table);
          } catch (e) {
            console.error("❌ [INLINE] Erreur émission événement:", e);
          }
        };
        
        processor.saveAllData = function(data) {
          console.log("ℹ️ [INLINE] saveAllData intercepté (ne fait rien)");
          // Ne plus sauvegarder dans localStorage du tout
        };
        
        // FORCER le vidage de localStorage pour éviter les conflits
        processor.loadAllData = function() {
          console.log("ℹ️ [INLINE] loadAllData intercepté (retourne vide)");
          return {}; // Toujours retourner vide - forcer utilisation IndexedDB
        };
        
        // Désactiver la restauration localStorage
        processor.restoreAllTablesData = function() {
          console.log("ℹ️ [INLINE] restoreAllTablesData intercepté");
          console.log("   La restauration se fera depuis IndexedDB uniquement");
          // Ne rien faire - laisser flowiseTableBridge restaurer depuis IndexedDB
        };
        
        // Marquer comme intégré
        processor.__integrated = true;
        
        // NETTOYER localStorage pour éviter conflits avec IndexedDB
        try {
          const oldData = localStorage.getItem('claraverse_tables_data');
          if (oldData) {
            console.log("🧹 [INLINE] Nettoyage localStorage (ancien système)");
            const parsed = JSON.parse(oldData);
            const count = Object.keys(parsed).length;
            console.log(`   ${count} table(s) dans localStorage - SUPPRESSION`);
            
            // SUPPRIMER les anciennes données localStorage
            localStorage.removeItem('claraverse_tables_data');
            console.log("   ✅ localStorage vidé - utilisation IndexedDB uniquement");
          }
        } catch (e) {
          console.warn("⚠️ [INLINE] Erreur nettoyage localStorage:", e);
        }
        
        console.log("✅ [INLINE] Intégration terminée");
        
        // TEST AUTOMATIQUE après 3 secondes
        setTimeout(() => {
          console.log("\n" + "=".repeat(60));
          console.log("🤖 TEST AUTOMATIQUE DE SAUVEGARDE");
          console.log("=".repeat(60));
          
          // 1. Installer écouteur d'événements
          let eventReceived = false;
          document.addEventListener('flowise:table:save:request', (e) => {
            eventReceived = true;
            console.log("✅ [TEST] Événement flowise:table:save:request REÇU");
            console.log("   Keyword:", e.detail.keyword);
            console.log("   SessionId:", e.detail.sessionId?.substring(0, 30) + "...");
            console.log("   Source:", e.detail.source);
          });
          
          // 2. Afficher le sessionId utilisé
          const currentSessionId = getSessionId();
          console.log("📍 [TEST] SessionId actuel:", currentSessionId);
          console.log("   Ce sessionId sera utilisé pour sauvegarder ET restaurer");
          
          // 3. Forcer la restauration avec ce sessionId APRÈS que les tables soient dans le DOM
          if (window.flowiseTableBridge && window.flowiseTableBridge.restoreTablesForSession) {
            // Attendre que des tables apparaissent dans le DOM
            const waitForTables = () => {
              const tablesInDOM = document.querySelectorAll('table').length;
              if (tablesInDOM > 0) {
                console.log(`🔄 [TEST] ${tablesInDOM} table(s) détectées, lancement restauration...`);
                window.flowiseTableBridge.restoreTablesForSession(currentSessionId)
                  .then(() => {
                    console.log("✅ [TEST] Restauration forcée terminée");
                  })
                  .catch(err => {
                    console.warn("⚠️ [TEST] Erreur restauration:", err.message);
                  });
              } else {
                console.log("⏳ [TEST] Attente des tables dans le DOM...");
                setTimeout(waitForTables, 1000); // Réessayer après 1 seconde
              }
            };
            
            setTimeout(waitForTables, 500); // Commencer après 0.5 seconde
          }
          
          // 4. Trouver une table
          const allTables = document.querySelectorAll('table');
          console.log(`📊 [TEST] ${allTables.length} table(s) trouvée(s) dans le DOM`);
          
          if (allTables.length > 0) {
            const testTable = allTables[0];
            console.log("🎯 [TEST] Test de sauvegarde sur la première table...");
            
            // 5. Appeler saveTableDataNow
            try {
              processor.saveTableDataNow(testTable);
              
              // 6. Vérifier après 1 seconde si l'événement a été reçu
              setTimeout(() => {
                console.log("\n📋 [TEST] RÉSULTAT:");
                if (eventReceived) {
                  console.log("✅ Événement émis ET reçu - LA SAUVEGARDE FONCTIONNE");
                  console.log("💡 Actualisez la page (F5) pour tester la restauration");
                } else {
                  console.error("❌ Événement NON reçu - menuIntegration ne répond pas");
                }
                console.log("=".repeat(60) + "\n");
              }, 1000);
              
            } catch (e) {
              console.error("❌ [TEST] Erreur lors de l'appel saveTableDataNow:", e);
            }
          } else {
            console.warn("⚠️ [TEST] Aucune table dans le DOM, impossible de tester");
            console.log("   Attendez que des tables apparaissent, puis actualisez");
            console.log("=".repeat(60) + "\n");
          }
        }, 3000);
        
        window.consoIndexedDBIntegration = {
          version: '3.0-inline',
          test: testIntegration
        };
        
        console.log("💡 [INLINE] Tapez: consoIndexedDBIntegration.test()");
      }
      
      function emitSaveEvent(table) {
        const keyword = extractKeyword(table);
        console.log("🔑 [INLINE] Keyword:", keyword);
        
        // CRITIQUE: Ajouter data-keyword sur la table pour restauration future
        if (!table.dataset.keyword) {
          table.dataset.keyword = keyword;
          console.log("✏️ [INLINE] Ajout data-keyword sur table:", keyword);
        }
        
        // CRITIQUE: Ajouter data-table-id stable si absent
        if (!table.dataset.tableId) {
          const tableId = `table_${keyword.toLowerCase().replace(/[^a-z0-9]/g, '_')}_${Date.now()}`;
          table.dataset.tableId = tableId;
          console.log("✏️ [INLINE] Ajout data-table-id:", tableId);
        }
        
        const sessionId = getSessionId();
        console.log("📍 [INLINE] SessionId:", sessionId.substring(0, 30) + "...");
        
        const event = new CustomEvent('flowise:table:save:request', {
          detail: {
            table: table,
            sessionId: sessionId,
            keyword: keyword,
            source: 'conso'
          },
          bubbles: true
        });
        
        document.dispatchEvent(event);
        console.log("✅ [INLINE] Événement émis pour:", keyword);
      }
      
      function extractKeyword(table) {
        if (table.dataset && table.dataset.keyword) {
          return table.dataset.keyword;
        }
        
        const wrapper = table.closest('[data-n8n-keyword]');
        if (wrapper && wrapper.dataset.n8nKeyword) {
          return wrapper.dataset.n8nKeyword;
        }
        
        const firstHeader = table.querySelector('th');
        if (firstHeader && firstHeader.textContent.trim()) {
          const text = firstHeader.textContent.trim();
          
          if (text.toLowerCase().includes('consolidation') || text.includes('📊')) {
            return 'Table_Consolidation';
          }
          
          return text.substring(0, 50);
        }
        
        if (table.classList.contains('claraverse-conso-table')) {
          return 'Table_Consolidation';
        }
        if (table.classList.contains('claraverse-resultat-table')) {
          return 'Table_Resultat';
        }
        
        const headers = Array.from(table.querySelectorAll('th'))
          .map(th => th.textContent.trim().toLowerCase());
        
        const headerText = headers.join(' ');
        
        if (headerText.includes('conclusion') || headerText.includes('assertion')) {
          return 'Table_Consolidation';
        }
        if (headerText.includes('resultat') || headerText.includes('résultat')) {
          return 'Table_Resultat';
        }
        
        return `Table_${Date.now()}`;
      }
      
      // VARIABLE GLOBALE pour cache sessionId actuel
      let cachedSessionId = null;
      let sessionIdSource = null; // Pour debugging
      let sessionIdRetryCount = 0;
      const MAX_SESSION_RETRY = 20; // 20 tentatives = 2 secondes max
      
      function getSessionId() {
        // FORCER utilisation d'un sessionId VRAIMENT stable PAR CHAT
        
        // 1. PRIORITÉ ABSOLUE: DOM (React expose currentSession.id via stableSessionId)
        try {
          const sessionElement = document.querySelector('[data-session-id], [data-chat-session-id], [data-clara-session-id]');
          if (sessionElement) {
            const domSessionId = sessionElement.getAttribute('data-session-id') || 
                                sessionElement.getAttribute('data-chat-session-id') ||
                                sessionElement.getAttribute('data-clara-session-id');
            if (domSessionId && domSessionId !== 'unknown' && domSessionId !== 'undefined') {
              // Mise à jour du cache si différent
              if (cachedSessionId !== domSessionId) {
                console.log("📍 [INLINE] SessionId depuis DOM:", domSessionId.substring(0, 30) + "...");
                console.log("✅ [INLINE] ISOLATION ACTIVE - SessionId unique par chat");
                
                // 🔔 LOG via système centralisé
                if (window.PersistanceLogger) {
                  window.PersistanceLogger.logSessionIdSource('DOM', domSessionId);
                }
                
                cachedSessionId = domSessionId;
                sessionIdSource = 'DOM';
                sessionIdRetryCount = 0; // Reset retry counter
              }
              return domSessionId;
            }
          }
        } catch (e) {
          console.warn("⚠️ [INLINE] Impossible de lire sessionId depuis DOM:", e.message);
        }
        
        // ✅ NOUVEAU: Si pas encore de sessionId DOM et qu'on a un cache valide, le réutiliser temporairement
        if (cachedSessionId && sessionIdSource === 'DOM' && sessionIdRetryCount < MAX_SESSION_RETRY) {
          sessionIdRetryCount++;
          console.log(`🔄 [INLINE] Réutilisation sessionId DOM caché (retry ${sessionIdRetryCount}/${MAX_SESSION_RETRY})`);
          return cachedSessionId; // Réutiliser l'ancien sessionId pendant que React remonte
        }
        
        // 2. Essayer l'URL (paramètres)
        try {
          const urlParams = new URLSearchParams(window.location.search);
          const paramNames = ['sessionId', 'session', 'chatId', 'chat_id'];
          for (const param of paramNames) {
            const urlSessionId = urlParams.get(param);
            if (urlSessionId) {
              if (cachedSessionId !== urlSessionId) {
                console.log("📍 [INLINE] SessionId depuis URL:", urlSessionId.substring(0, 30) + "...");
                cachedSessionId = urlSessionId;
                sessionIdSource = 'URL';
              }
              return urlSessionId;
            }
          }
        } catch (e) {}
        
        // 3. Essayer claraDB (accès direct à la session React)
        try {
          // Attendre que React soit monté
          if (window.claraDB) {
            // Méthode 1: getCurrentSession
            if (typeof window.claraDB.getCurrentSession === 'function') {
              const session = window.claraDB.getCurrentSession();
              if (session && session.id) {
                if (cachedSessionId !== session.id) {
                  console.log("📍 [INLINE] SessionId depuis claraDB.getCurrentSession:", session.id.substring(0, 30) + "...");
                  cachedSessionId = session.id;
                  sessionIdSource = 'claraDB';
                }
                return session.id;
              }
            }
            
            // Méthode 2: getActiveClaraSession (si disponible)
            if (typeof window.claraDB.getActiveClaraSession === 'function') {
              const activeSession = window.claraDB.getActiveClaraSession();
              if (activeSession && activeSession.id) {
                if (cachedSessionId !== activeSession.id) {
                  console.log("📍 [INLINE] SessionId depuis claraDB.getActiveClaraSession:", activeSession.id.substring(0, 30) + "...");
                  cachedSessionId = activeSession.id;
                  sessionIdSource = 'claraDB';
                }
                return activeSession.id;
              }
            }
          }
        } catch (e) {
          console.warn("⚠️ [INLINE] Erreur claraDB:", e.message);
        }
        
        // 4. ⚠️ FALLBACK DANGEREUX: sessionStorage (pas isolé par chat)
        const STABLE_KEY = 'claraverse_stable_session';
        
        try {
          let stored = sessionStorage.getItem(STABLE_KEY);
          if (stored) {
            if (sessionIdSource !== 'sessionStorage') {
              console.error("🚨 [INLINE] ALERTE: SessionId depuis sessionStorage");
              console.error("   ❌ ISOLATION DES CHATS NON GARANTIE");
              console.error("   ❌ Les tables peuvent être partagées entre chats!");
              console.error("   💡 Vérifiez que React expose bien data-session-id");
              
              // 🔔 NOTIFICATION CRITIQUE
              if (window.PersistanceLogger) {
                window.PersistanceLogger.logCriticalError('isolation-compromise', 
                  'data-session-id absent du DOM - React ne l\'expose pas');
              }
              
              sessionIdSource = 'sessionStorage';
            }
            cachedSessionId = stored;
            return stored;
          }
        } catch (e) {}
        
        // 5. DERNIER RECOURS: Créer nouveau sessionId
        const newSession = `fallback_session_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
        
        try {
          sessionStorage.setItem(STABLE_KEY, newSession);
          console.error("🚨 [INLINE] Nouveau sessionId créé (FALLBACK)");
          console.error("   ❌ Isolation des chats NON garantie");
          sessionIdSource = 'new-sessionStorage';
        } catch (e) {}
        
        cachedSessionId = newSession;
        return newSession;
      }
      
      // Observer pour détecter changement de data-session-id (changement de chat)
      function watchSessionIdChanges() {
        const targetNode = document.body;
        const config = { attributes: true, subtree: true, attributeFilter: ['data-session-id', 'data-chat-session-id'] };
        
        const callback = function(mutationsList) {
          for (const mutation of mutationsList) {
            if (mutation.type === 'attributes') {
              const newSessionId = mutation.target.getAttribute('data-session-id') || 
                                   mutation.target.getAttribute('data-chat-session-id');
              
              if (newSessionId && newSessionId !== cachedSessionId) {
                console.log("🔄 [INLINE] CHANGEMENT DE CHAT DÉTECTÉ!");
                console.log("   Ancien sessionId:", cachedSessionId?.substring(0, 30) + "...");
                console.log("   Nouveau sessionId:", newSessionId.substring(0, 30) + "...");
                cachedSessionId = newSessionId;
                sessionIdSource = 'DOM';
                
                // Force restauration des tables pour le nouveau chat
                if (window.flowiseTableBridge && window.flowiseTableBridge.restoreTablesForSession) {
                  console.log("🔄 [INLINE] Restauration automatique pour nouveau chat...");
                  window.flowiseTableBridge.restoreTablesForSession(newSessionId)
                    .then(() => console.log("✅ [INLINE] Tables du nouveau chat restaurées"))
                    .catch(err => console.warn("⚠️ [INLINE] Erreur restauration:", err.message));
                }
              }
            }
          }
        };
        
        const observer = new MutationObserver(callback);
        observer.observe(targetNode, config);
        console.log("👁️ [INLINE] Observer installé pour détecter changements de session");
      }
      
      // Démarrer l'observer dès que possible
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', watchSessionIdChanges);
      } else {
        watchSessionIdChanges();
      }
      
      function testIntegration() {
        console.log("\n🧪 [INLINE] TEST D'INTÉGRATION");
        console.log("═══════════════════════════════");
        
        if (window.claraverseProcessor) {
          console.log("✅ claraverseProcessor disponible");
          
          // Vérifier si la méthode a été remplacée
          const fnString = window.claraverseProcessor.saveTableDataNow.toString();
          console.log("📝 Fonction saveTableDataNow:");
          console.log(fnString.substring(0, 200) + "...");
          
          if (fnString.includes('INLINE')) {
            console.log("✅ saveTableDataNow REMPLACÉE (contient INLINE)");
          } else {
            console.error("❌ saveTableDataNow NON REMPLACÉE");
            console.error("   La fonction n'a pas été modifiée !");
          }
          
          // Vérifier le flag d'intégration
          if (window.claraverseProcessor.__integrated) {
            console.log("✅ Flag __integrated présent");
          } else {
            console.warn("⚠️ Flag __integrated absent");
          }
          
        } else {
          console.error("❌ claraverseProcessor NON disponible");
          return;
        }
        
        if (window.flowiseTableBridge) {
          console.log("✅ flowiseTableBridge disponible");
        } else {
          console.warn("⚠️ flowiseTableBridge NON disponible");
        }
        
        if (window.flowiseTableService) {
          console.log("✅ flowiseTableService disponible");
        } else {
          console.warn("⚠️ flowiseTableService NON disponible");
        }
        
        const tables = document.querySelectorAll('table');
        console.log(`✅ ${tables.length} table(s) dans le DOM`);
        
        const consoTable = document.querySelector('.claraverse-conso-table');
        if (consoTable) {
          console.log("✅ Table_conso trouvée");
          const keyword = extractKeyword(consoTable);
          console.log("   Keyword:", keyword);
        } else {
          console.warn("⚠️ Table_conso non trouvée");
        }
        
        const sessionId = getSessionId();
        console.log("✅ SessionId:", sessionId.substring(0, 40) + "...");
        
        console.log("═══════════════════════════════");
        console.log("✅ Test terminé\n");
        
        console.log("💡 Pour tester la sauvegarde manuellement:");
        console.log("   1. Trouvez une table dans la page");
        console.log("   2. const table = document.querySelector('table')");
        console.log("   3. window.claraverseProcessor.saveTableDataNow(table)");
        console.log("   4. Observez les logs [INLINE]\n");
      }
      
      console.log("⏳ [INLINE] Attente de claraverseProcessor...");
      
      // Méthode 1: Polling avec délai augmenté
